<title>מנגנון גלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1712;
    --cream: #f6f2ea;
    color-scheme: dark;
  }

  /* Deliberate single dark, cinematic treatment — matches the HAWAM
     brand's own dark "reveal" sections; not theme-switched on purpose. */

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Assistant', sans-serif;
  }

  .rtl-root { direction: rtl; }

  .spacer {
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
  }
  .spacer h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: clamp(1.4rem, 3.4vw, 2rem);
    max-width: 28ch;
    line-height: 1.5;
    text-wrap: balance;
    color: var(--cream);
  }

  .stage-wrap { position: relative; height: 350vh; }
  .stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
  }

  .zoom-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .stage-caption {
    position: absolute;
    z-index: 10;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    padding: 0 1.5rem;
    pointer-events: none;
  }
  .stage-caption p {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: clamp(1.5rem, 3.6vw, 2.3rem);
    text-shadow: 0 2px 24px rgba(0,0,0,0.6);
  }

  .settle-caption {
    position: absolute; z-index: 10; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; padding: 0 1.5rem; max-width: 34rem;
    opacity: 0;
  }
  .settle-caption h2 {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 500;
    font-size: clamp(1.7rem, 3.8vw, 2.6rem);
    color: var(--cream); text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    margin-bottom: 0.9rem;
  }
  .settle-caption p {
    font-size: clamp(0.95rem, 1.6vw, 1.1rem);
    color: #e7ddc9; text-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }

  .collections-section {
    background: var(--cream); color: #2b2621;
    padding: 14vh 2rem; text-align: center;
  }
  .collections-section h2 {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 500;
    font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 1rem;
  }
  .collections-section p {
    color: #5c5449; font-size: 1.05rem; max-width: 36ch; margin: 0 auto;
  }
</style>

<div class="rtl-root" lang="he">

  <div class="spacer"><h1>וילונות שהם יצירת אמנות</h1></div>

  <section class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <img class="zoom-frame" id="zoomFrame0" src="assets/zoom/hawam_zoom_00.jpg" alt="וילון יוקרתי" style="opacity:1">
      <img class="zoom-frame" id="zoomFrame1" src="assets/zoom/hawam_zoom_01.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame2" src="assets/zoom/hawam_zoom_02.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame3" src="assets/zoom/hawam_zoom_03.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame4" src="assets/zoom/hawam_zoom_04.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame5" src="assets/zoom/hawam_zoom_05.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame6" src="assets/zoom/hawam_zoom_06.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame7" src="assets/zoom/hawam_zoom_07.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame8" src="assets/zoom/hawam_zoom_08.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame9" src="assets/zoom/hawam_zoom_09.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame10" src="assets/zoom/hawam_zoom_10.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame11" src="assets/zoom/hawam_zoom_11.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame12" src="assets/zoom/hawam_zoom_12.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame13" src="assets/zoom/hawam_zoom_13.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame14" src="assets/zoom/hawam_zoom_14.jpg" alt="" style="opacity:0">
      <img class="zoom-frame" id="zoomFrame15" src="assets/zoom/hawam_zoom_15.jpg" alt="תקריב על אריגת הבד" style="opacity:0">
      <div class="stage-caption"><p id="captionText">וילון יוקרתי</p></div>
      <div class="settle-caption" id="settleCaption">
        <h2>מרקם שמספר סיפור</h2>
        <p>כל בד נבחר בקפידה, וכל וילון נתפר בהתאמה אישית.</p>
      </div>
    </div>
  </section>

  <section class="collections-section">
    <h2>הקולקציות שלנו</h2>
    <p>כל קולקציה מספרת סיפור אחר של אור, בד וצבע.</p>
  </section>

</div>

<script>
  // Direct scroll-linked frame scrubbing. All 16 frames are already in the
  // DOM (no src swapping, no network fetch mid-scroll) — only opacity is
  // toggled, so there is nothing to flash or decode while scrolling.
  // Progress is recomputed from scrollY on every frame; nothing is
  // time-based, so scrolling up reverses identically.

  const FRAME_COUNT = 16;
  const HOLD_FROM = 0.85; // frame 15 holds steady before the pin releases

  const frames = Array.from({ length: FRAME_COUNT }, (_, i) =>
    document.getElementById('zoomFrame' + i)
  );

  const stageWrap = document.getElementById('stageWrap');
  const captionEl = document.getElementById('captionText');
  const settleCaptionEl = document.getElementById('settleCaption');

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const smoothstep = (a, b, x) => clamp01((x - a) / (b - a));

  let ready = false;
  Promise.all(frames.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => { img.addEventListener('load', resolve, { once: true }); });
  })).then(() => { ready = true; render(); });

  function getProgress() {
    const total = stageWrap.offsetHeight - window.innerHeight;
    if (total <= 0) return 0;
    return clamp01((window.scrollY - stageWrap.offsetTop) / total);
  }

  function render() {
    if (!ready) return;

    const p = getProgress();
    const zoomT = clamp01(p / HOLD_FROM);
    // Snap to the nearest frame instead of cross-fading two adjacent ones —
    // blending two different crops as opacity overlaps produces a hazy
    // double-exposure look. The 16 frames are dense enough that a hard
    // switch still reads as a continuous push-in.
    const active = Math.round(zoomT * (FRAME_COUNT - 1));

    for (let i = 0; i < FRAME_COUNT; i++) {
      frames[i].style.opacity = i === active ? 1 : 0;
    }

    captionEl.style.opacity = 1 - clamp01(p / 0.12);

    // Settle-on-fabric title: additive on top of the untouched zoom
    // mechanism above — reads the same progress value but never touches
    // frame selection.
    const settleIn = smoothstep(HOLD_FROM + 0.03, HOLD_FROM + 0.08, p);
    const settleOut = 1 - smoothstep(0.96, 1.0, p);
    settleCaptionEl.style.opacity = settleIn * settleOut;
  }

  let ticking = false;
  function onScroll() {
    if (!ticking) {
      requestAnimationFrame(() => { render(); ticking = false; });
      ticking = true;
    }
  }
  document.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', render);
  render();
</script>
