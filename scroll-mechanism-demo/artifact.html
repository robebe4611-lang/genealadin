<title>מנגנון גלילה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1712;
    --ink-2: #2b2621;
    --cream: #f6f2ea;
    --gold: #b6905f;
    --gold-soft: #d9c3a0;
    color-scheme: dark;
  }

  /* Deliberate single dark, cinematic treatment — matches the HAWAM
     brand's own dark "reveal" sections; not theme-switched on purpose. */

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Assistant', sans-serif;
  }

  .rtl-root { direction: rtl; }

  .badge {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 16px;
    z-index: 50;
    background: var(--ink-2);
    border: 1px solid rgba(217, 195, 160, 0.35);
    color: var(--gold-soft);
    font-size: 0.72rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }

  .spacer {
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
  }
  .spacer h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: clamp(1.2rem, 3.2vw, 1.7rem);
    max-width: 32ch;
    line-height: 1.55;
    text-wrap: balance;
    color: var(--cream);
  }

  .stage-wrap { position: relative; height: 400vh; }
  .stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    inset: 0;
    will-change: transform, opacity;
  }
  .layer img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
  #layerZoom { z-index: 1; opacity: 1; }
  #layerCollections { z-index: 2; opacity: 0; transform: scale(1.18); }

  .collections-grid {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    background: var(--ink);
  }
  .collections-grid img { width: 100%; height: 100%; object-fit: cover; position: static; }

  .stage-caption {
    position: absolute;
    z-index: 10;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    padding: 0 1.5rem;
    pointer-events: none;
  }
  .stage-caption p {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: clamp(1.3rem, 3.4vw, 2.1rem);
    text-shadow: 0 2px 24px rgba(0,0,0,0.65);
  }

  .readout {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    left: 16px;
    z-index: 50;
    font-family: 'SF Mono', 'Consolas', 'Cascadia Code', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.7rem;
    color: var(--gold);
    background: rgba(28, 23, 18, 0.7);
    border: 1px solid rgba(217, 195, 160, 0.25);
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .layer { transition: none !important; }
  }
</style>

<div class="rtl-root" lang="he">

  <div class="badge">דמו מנגנון · קולקציות = placeholder</div>

  <div class="spacer"><h1>גלול למטה כדי לבדוק את הזום הרציף לתוך הבד ואת המעבר לקולקציות</h1></div>

  <section class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div class="layer" id="layerZoom">
        <img id="zoomImgA" alt="וילון יוקרתי — זום רציף לתוך הבד">
        <img id="zoomImgB" alt="" style="opacity:0">
      </div>
      <div class="layer" id="layerCollections">
        <div class="collections-grid">
          <img src="assets/roman-shade.jpg" alt="">
          <img src="assets/sheer-living-room.jpg" alt="">
          <img src="assets/soft-roman.jpg" alt="">
          <img src="assets/custom-curtains.jpg" alt="">
        </div>
      </div>
      <div class="stage-caption"><p id="captionText">וילון יוקרתי</p></div>
    </div>
  </section>

  <div class="spacer"><h1>סוף הדמו — גלול חזרה למעלה כדי לוודא שהמעבר עובד גם אחורה</h1></div>

  <div class="readout" id="progressReadout">progress: 0.00</div>

</div>

<script>
  // Direct scroll-linked scrubbing — no library, no easing lag.
  // Progress is recomputed from scrollY every frame; scrolling up
  // reverses identically since nothing is time-based.

  const ZOOM_FRAME_COUNT = 16;
  const zoomFrameUrls = Array.from({ length: ZOOM_FRAME_COUNT }, (_, i) =>
    `assets/zoom/hawam_zoom_${String(i).padStart(2, '0')}.jpg`
  );
  zoomFrameUrls.forEach(src => { const im = new Image(); im.src = src; }); // preload

  const stageWrap = document.getElementById('stageWrap');
  const zoomImgA = document.getElementById('zoomImgA');
  const zoomImgB = document.getElementById('zoomImgB');
  const layerZoom = document.getElementById('layerZoom');
  const layerCollections = document.getElementById('layerCollections');
  const captionText = document.getElementById('captionText');
  const readout = document.getElementById('progressReadout');

  zoomImgA.src = zoomFrameUrls[0];
  zoomImgB.src = zoomFrameUrls[1];

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const smoothstep = (a, b, x) => clamp01((x - a) / (b - a));

  const captions = [
    { until: 0.28, text: 'וילון יוקרתי' },
    { until: 0.55, text: 'כל קפל, מרקם משלו' },
    { until: 1.01, text: 'הקולקציות שלנו' }
  ];

  function getProgress() {
    const total = stageWrap.offsetHeight - window.innerHeight;
    if (total <= 0) return 0;
    return clamp01((window.scrollY - stageWrap.offsetTop) / total);
  }

  function render() {
    const p = getProgress();
    readout.textContent = 'progress: ' + p.toFixed(2);

    const zoomT = clamp01(p / 0.55);
    const frameFloat = zoomT * (ZOOM_FRAME_COUNT - 1);
    const lo = Math.floor(frameFloat);
    const hi = Math.min(lo + 1, ZOOM_FRAME_COUNT - 1);
    const frac = frameFloat - lo;
    zoomImgA.src = zoomFrameUrls[lo];
    zoomImgB.src = zoomFrameUrls[hi];
    zoomImgB.style.opacity = frac;

    const zoomOpacity = 1 - smoothstep(0.55, 0.85, p);
    const collProgress = smoothstep(0.6, 0.9, p);
    layerZoom.style.opacity = zoomOpacity;
    layerCollections.style.opacity = collProgress;
    layerCollections.style.transform = `scale(${1.18 - 0.18 * collProgress})`;

    const match = captions.find(c => p < c.until) || captions[captions.length - 1];
    if (captionText.textContent !== match.text) captionText.textContent = match.text;
  }

  let ticking = false;
  function onScroll() {
    if (!ticking) {
      requestAnimationFrame(() => { render(); ticking = false; });
      ticking = true;
    }
  }
  document.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', render);
  render();
</script>
