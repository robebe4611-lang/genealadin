<title>מנגנון גלילה</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1712;
    --ink-2: #2b2621;
    --cream: #f6f2ea;
    --gold: #b6905f;
    --gold-soft: #d9c3a0;
    color-scheme: dark;
  }

  /* Deliberate single dark, cinematic treatment — matches the HAWAM
     brand's own dark "reveal" sections; not theme-switched on purpose. */

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Assistant', sans-serif;
  }

  .rtl-root { direction: rtl; }

  .badge {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 16px;
    z-index: 50;
    background: var(--ink-2);
    border: 1px solid rgba(217, 195, 160, 0.35);
    color: var(--gold-soft);
    font-size: 0.72rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }

  .spacer {
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
  }
  .spacer h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: clamp(1.2rem, 3.2vw, 1.7rem);
    max-width: 32ch;
    line-height: 1.55;
    text-wrap: balance;
    color: var(--cream);
  }

  .stage-wrap { position: relative; height: 400vh; }
  .stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    inset: 0;
    will-change: transform, opacity;
  }
  .layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #layerHero { z-index: 1; opacity: 1; }
  #layerTexture { z-index: 2; opacity: 0; }
  #layerCollections { z-index: 3; opacity: 0; }

  .collections-grid {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    background: var(--ink);
  }
  .collections-grid img { width: 100%; height: 100%; object-fit: cover; }

  .stage-caption {
    position: absolute;
    z-index: 10;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    padding: 0 1.5rem;
    pointer-events: none;
  }
  .stage-caption p {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: clamp(1.3rem, 3.4vw, 2.1rem);
    text-shadow: 0 2px 24px rgba(0,0,0,0.65);
  }

  .readout {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    left: 16px;
    z-index: 50;
    font-family: 'SF Mono', 'Consolas', 'Cascadia Code', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.7rem;
    color: var(--gold);
    background: rgba(28, 23, 18, 0.7);
    border: 1px solid rgba(217, 195, 160, 0.25);
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .layer { transition: none !important; }
  }
</style>

<div class="rtl-root" lang="he">

  <div class="badge">דמו מנגנון · תמונות זמניות</div>

  <div class="spacer"><h1>גלול למטה כדי לבדוק את המעבר בין שלוש הסצנות</h1></div>

  <section class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div class="layer" id="layerHero">
        <img src="assets/hero-living-room.jpg" alt="וילון יוקרתי בסלון">
      </div>
      <div class="layer" id="layerTexture">
        <img src="assets/texture-closeup.jpg" alt="תקריב על אריגת הבד">
      </div>
      <div class="layer" id="layerCollections">
        <div class="collections-grid">
          <img src="assets/roman-shade.jpg" alt="">
          <img src="assets/sheer-living-room.jpg" alt="">
          <img src="assets/soft-roman.jpg" alt="">
          <img src="assets/custom-curtains.jpg" alt="">
        </div>
      </div>
      <div class="stage-caption"><p id="captionText">וילון יוקרתי</p></div>
    </div>
  </section>

  <div class="spacer"><h1>סוף הדמו — גלול חזרה למעלה כדי לוודא שהמעבר עובד גם אחורה</h1></div>

  <div class="readout" id="progressReadout">progress: 0.00</div>

</div>

<script>
  gsap.registerPlugin(ScrollTrigger);

  gsap.set('#layerHero', { scale: 1, opacity: 1 });
  gsap.set('#layerTexture', { scale: 1.18, opacity: 0 });
  gsap.set('#layerCollections', { scale: 1.18, opacity: 0 });

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#stageWrap',
      start: 'top top',
      end: 'bottom bottom',
      scrub: 0.4
    }
  });

  tl.to('#layerHero', { scale: 1.35, opacity: 0, ease: 'none', duration: 0.45 }, 0);
  tl.to('#layerTexture', { scale: 1.0, opacity: 1, ease: 'none', duration: 0.4 }, 0.08);

  tl.to('#layerTexture', { scale: 1.3, opacity: 0, ease: 'none', duration: 0.42 }, 0.55);
  tl.to('#layerCollections', { scale: 1.0, opacity: 1, ease: 'none', duration: 0.4 }, 0.62);

  const captionText = document.getElementById('captionText');
  const captions = [
    { until: 0.35, text: 'וילון יוקרתי' },
    { until: 0.65, text: 'כל קפל, מרקם משלו' },
    { until: 1.01, text: 'הקולקציות שלנו' }
  ];
  const readout = document.getElementById('progressReadout');

  ScrollTrigger.create({
    trigger: '#stageWrap',
    start: 'top top',
    end: 'bottom bottom',
    onUpdate: (self) => {
      const p = self.progress;
      readout.textContent = 'progress: ' + p.toFixed(2);
      const match = captions.find(c => p < c.until) || captions[captions.length - 1];
      if (captionText.textContent !== match.text) captionText.textContent = match.text;
    }
  });
</script>
