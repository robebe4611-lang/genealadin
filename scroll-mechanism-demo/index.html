<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חוואם דיזיין</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Assistant',sans-serif; background:#1c1712; color:#f6f2ea; }

  .spacer { height:60vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 2rem; }
  .spacer h1 { font-family:'Frank Ruhl Libre',serif; font-weight:500; font-size:1.8rem; max-width:600px; line-height:1.5; }

  .stage-wrap { position:relative; height:350vh; }
  .stage { position:sticky; top:0; height:100vh; overflow:hidden; }

  .zoom-frame {
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover; display:block;
  }

  .stage-caption {
    position:absolute; z-index:10; top:10%; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none; padding:0 1.5rem;
  }
  .stage-caption p {
    font-family:'Frank Ruhl Libre',serif; font-weight:500;
    font-size:clamp(1.6rem,3.6vw,2.6rem);
    color:#f6f2ea; text-shadow:0 2px 20px rgba(0,0,0,0.55);
  }

  .settle-caption {
    position:absolute; z-index:10; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; padding:0 1.5rem; max-width:34rem;
    opacity:0;
  }
  .settle-caption h2 {
    font-family:'Frank Ruhl Libre',serif; font-weight:500;
    font-size:clamp(1.7rem,3.8vw,2.6rem);
    color:#f6f2ea; text-shadow:0 2px 24px rgba(0,0,0,0.6);
    margin-bottom:0.9rem;
  }
  .settle-caption p {
    font-size:clamp(0.95rem,1.6vw,1.1rem);
    color:#e7ddc9; text-shadow:0 2px 16px rgba(0,0,0,0.6);
  }

  .collections-section {
    background:#f6f2ea; color:#2b2621;
    padding:14vh 2rem; text-align:center;
  }
  .collections-section h2 {
    font-family:'Frank Ruhl Libre',serif; font-weight:500;
    font-size:clamp(1.8rem,4vw,2.8rem); margin-bottom:1rem;
  }
  .collections-section p {
    color:#5c5449; font-size:1.05rem; max-width:36ch; margin:0 auto;
  }
</style>
</head>
<body>

<div class="spacer"><h1>וילונות שהם יצירת אמנות</h1></div>

<section class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <img class="zoom-frame" id="zoomFrame0" src="assets/zoom/hawam_zoom_00.jpg" alt="וילון יוקרתי" style="opacity:1">
    <img class="zoom-frame" id="zoomFrame1" src="assets/zoom/hawam_zoom_01.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame2" src="assets/zoom/hawam_zoom_02.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame3" src="assets/zoom/hawam_zoom_03.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame4" src="assets/zoom/hawam_zoom_04.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame5" src="assets/zoom/hawam_zoom_05.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame6" src="assets/zoom/hawam_zoom_06.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame7" src="assets/zoom/hawam_zoom_07.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame8" src="assets/zoom/hawam_zoom_08.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame9" src="assets/zoom/hawam_zoom_09.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame10" src="assets/zoom/hawam_zoom_10.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame11" src="assets/zoom/hawam_zoom_11.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame12" src="assets/zoom/hawam_zoom_12.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame13" src="assets/zoom/hawam_zoom_13.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame14" src="assets/zoom/hawam_zoom_14.jpg" alt="" style="opacity:0">
    <img class="zoom-frame" id="zoomFrame15" src="assets/zoom/hawam_zoom_15.jpg" alt="תקריב על אריגת הבד" style="opacity:0">
    <div class="stage-caption"><p id="captionText">וילון יוקרתי</p></div>
    <div class="settle-caption" id="settleCaption">
      <h2>מרקם שמספר סיפור</h2>
      <p>כל בד נבחר בקפידה, וכל וילון נתפר בהתאמה אישית.</p>
    </div>
  </div>
</section>

<section class="collections-section">
  <h2>הקולקציות שלנו</h2>
  <p>כל קולקציה מספרת סיפור אחר של אור, בד וצבע.</p>
</section>

<script src="js/script.js"></script>
</body>
</html>
