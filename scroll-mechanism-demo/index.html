<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדגמת מנגנון גלילה — HAWAM</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Assistant',sans-serif; background:#1c1712; color:#f6f2ea; }

  .notice {
    position: fixed; top:0; left:0; right:0; z-index:50;
    background:#b6905f; color:#1c1712; font-size:0.8rem; text-align:center;
    padding:0.5rem 1rem; letter-spacing:0.02em;
  }

  .spacer { height:60vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 2rem; }
  .spacer h1 { font-family:'Frank Ruhl Libre',serif; font-size:1.8rem; max-width:600px; line-height:1.5; }

  .stage-wrap { position:relative; height:400vh; }
  .stage { position:sticky; top:0; height:100vh; overflow:hidden; }

  .layer { position:absolute; inset:0; }
  .layer img { width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }

  #layerZoom { z-index:1; opacity:1; }
  #layerCollections { z-index:2; opacity:0; transform:scale(1.18); }

  .collections-grid {
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:4px;
    background:#000; width:100%; height:100%;
  }
  .collections-grid img { width:100%; height:100%; object-fit:cover; display:block; position:static; }

  .stage-caption {
    position:absolute; z-index:10; top:8%; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
  }
  .stage-caption p {
    font-family:'Frank Ruhl Libre',serif; font-size:clamp(1.4rem,3vw,2.2rem);
    color:#f6f2ea; text-shadow:0 2px 20px rgba(0,0,0,0.6);
  }

  .progress-readout {
    position:fixed; bottom:1rem; left:1rem; z-index:50;
    font-family:monospace; font-size:0.75rem; color:#b6905f;
    background:rgba(0,0,0,0.5); padding:0.3rem 0.6rem; border-radius:4px;
  }
</style>
</head>
<body>

<div class="notice">דמו מבודד — בודק רק את מנגנון הגלילה. סצנת "הקולקציות" היא placeholder (ראה הסבר בצ'אט).</div>

<div class="spacer"><h1>גלול למטה כדי לבדוק את הזום הרציף לתוך הבד ואת המעבר לקולקציות</h1></div>

<section class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <div class="layer" id="layerZoom">
      <img id="zoomImgA" alt="וילון יוקרתי — זום רציף לתוך הבד">
      <img id="zoomImgB" alt="" style="opacity:0">
    </div>
    <div class="layer" id="layerCollections">
      <div class="collections-grid">
        <img src="assets/roman-shade.jpg" alt="">
        <img src="assets/sheer-living-room.jpg" alt="">
        <img src="assets/soft-roman.jpg" alt="">
        <img src="assets/custom-curtains.jpg" alt="">
      </div>
    </div>
    <div class="stage-caption"><p id="captionText">וילון יוקרתי</p></div>
  </div>
</section>

<div class="spacer"><h1>סוף הדמו — גלול חזרה למעלה כדי לוודא שהמעבר עובד גם אחורה</h1></div>

<div class="progress-readout" id="progressReadout">progress: 0.00</div>

<script src="js/script.js"></script>
</body>
</html>
