<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!--
    Abstract impression of a sunlit contemporary interior with a
    floor-to-ceiling window — a soft-focus editorial placeholder built
    entirely from gradients, standing in for real architectural
    photography until that is shot. Palette is restricted to the
    HAWAM DESIGN tokens (ivory / sand / stone / charcoal / white).
    Swap this file for a real photograph later without touching any CSS —
    frontend/css/hero.css only references its path.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F3ED"/>
      <stop offset="30%" stop-color="#E9E2D8"/>
      <stop offset="62%" stop-color="#C9BDAE"/>
      <stop offset="100%" stop-color="#8F8574"/>
    </linearGradient>

    <radialGradient id="sun" cx="78%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="40%" stop-color="#F6F3ED" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F6F3ED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#D9CFBF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8A8072" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#B8AB97"/>
      <stop offset="45%" stop-color="#A0937E"/>
      <stop offset="100%" stop-color="#716B63"/>
    </linearGradient>

    <linearGradient id="drape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6F3ED" stop-opacity="0"/>
      <stop offset="35%" stop-color="#E9E2D8" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#C9BDAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6B655C" stop-opacity="0.65"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="62%" r="78%">
      <stop offset="50%" stop-color="#252422" stop-opacity="0"/>
      <stop offset="100%" stop-color="#252422" stop-opacity="0.32"/>
    </radialGradient>

    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="blurMed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurFine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grainFloor" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0.35 0"/>
    </filter>
  </defs>

  <!-- wall / ambient light -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#wall)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sun)"/>

  <!-- floor plane, soft perspective, with a grained wood-plank pass so it
       reads as a material rather than a flat color field -->
  <polygon points="0,1080 1920,1080 1920,430 0,500" fill="url(#floor)" filter="url(#blurMed)"/>
  <polygon points="0,1080 1920,1080 1920,430 0,500" filter="url(#grainFloor)" opacity="0.7"/>
  <!-- contact shadow where wall meets floor, for a defined horizon rather
       than one gradient bleeding into the next -->
  <polygon points="0,500 1920,430 1920,520 0,590" fill="#252422" opacity="0.1" filter="url(#blurMed)"/>
  <g filter="url(#blurMed)" stroke="#252422" stroke-opacity="0.14" stroke-width="3">
    <line x1="0" y1="620" x2="1920" y2="580"/>
    <line x1="0" y1="740" x2="1920" y2="705"/>
    <line x1="0" y1="870" x2="1920" y2="850"/>
    <line x1="0" y1="990" x2="1920" y2="975"/>
  </g>

  <!-- soft furniture silhouette, far out of focus -->
  <rect x="60" y="540" width="620" height="120" rx="30" fill="#252422" fill-opacity="0.16" filter="url(#blurSoft)"/>

  <!-- floor-to-ceiling window -->
  <rect x="1180" y="0" width="620" height="1080" fill="url(#glass)"/>
  <g stroke="#252422" stroke-opacity="0.22" stroke-width="4">
    <line x1="1180" y1="0" x2="1180" y2="1080"/>
    <line x1="1490" y1="0" x2="1490" y2="1080"/>
    <line x1="1800" y1="0" x2="1800" y2="1080"/>
    <line x1="1180" y1="360" x2="1800" y2="360"/>
    <line x1="1180" y1="720" x2="1800" y2="720"/>
  </g>

  <!-- soft sheer drape framing the window, echoing the curtain motif -->
  <path d="M1130,-20 C1080,220 1250,420 1120,700 C1040,880 1150,1000 1110,1100 L1300,1100 C1300,760 1230,560 1290,340 C1330,180 1260,60 1300,-20 Z"
        fill="url(#drape)" filter="url(#blurFine)"/>

  <!-- vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>
</svg>
