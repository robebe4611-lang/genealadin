services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genealadin
      POSTGRES_USER: genealadin
      POSTGRES_PASSWORD: genealadin
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealadin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://genealadin:genealadin@db:5432/genealadin
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
