      h += '<div class="card load-card"><h2>' + I("truck") + " " + (d.loads.length ? "העמסה נוספת" : "לפני שיוצאים: מה העמסת?") + '</h2><p class="muted" style="margin:0;font-size:14px">' + (d.loads.length ? "" : "לפי ההזמנות של היום צריך: " + Object.keys(TYPES).map((k) => stops.reduce((a, o) => a + (o.items[k] || 0), 0) + " " + TYPES[k].many).join(" · ")) + "</p>" +
        Object.keys(TYPES).map((k) => '<div class="stepper"><span style="font-size:17px;font-weight:500">' + TYPES[k].name + '</span><div class="ctl"><button data-lq="' + k + '" data-n="-1">−</button><b>' + f[k] + '</b><button data-lq="' + k + '" data-n="1">+</button></div></div>').join("") +
        '<button class="btn f press" data-load="' + d.id + '"' + (f["12"] + f["48"] ? "" : " disabled") + ">שמור העמסה</button>" + (d.loads.length ? '<button class="quiet-link" data-load-cancel="' + d.id + '">חזרה</button>' : "") + "</div>";
    } else {
      const tk0 = truck(d); const emp = {}; K.forEach((k) => { emp[k] = tk0[k].empties; });
      h += '<div class="card"><div class="row"><h2>' + I("truck") + ' המשאית שלי</h2><button class="btn-s" data-load-more="' + d.id + '">+ העמסה</button></div>' + truckTable(d) +
        (unloadAsk === d.id
          ? '<div class="unload-ask"><p>לפרוק במחסן: ' + itemsHtml(emp) + '</p><div class="confirm-row"><button class="btn f press" data-unload="' + d.id + '">כן, פרקתי</button><button class="btn g press" data-unload-no="1">לא</button></div></div>'
          : '<button class="btn g press unload-btn" data-unload-ask="' + d.id + '"' + (itemsN(emp) ? "" : " disabled") + ">" + I("check") + " פרקתי ריקים במחסן" + (itemsN(emp) ? " · " + itemsN(emp) : "") + "</button>") +
        (d.unloads.length ? '<p class="muted" style="margin:8px 0 0;font-size:15px">' + d.unloads.map((u) => "פרק ב-" + u.at + ": " + itemsTxt(u) + " ריקים").join("<br>") + "</p>" : "") + "</div>";
    }
    if (!stops.length) h += '<div class="card"><p style="text-align:center;font-size:19px;font-weight:600;margin:8px 0">סיימתי את כל התחנות להיום</p></div>';
    stops.forEach((o, i) => {
      const c = cust(o.cid); const cur = i === 0;
      if (cur && dmode.id !== o.id) dmode = { id: o.id, mode: "idle", q: { ...o.items }, e: { ...o.items }, pay: "cash" };
      h += '<div class="card' + (cur ? "" : " dim") + (flashIds.has("o-" + o.id) ? " flash" : "") + '" style="display:flex;flex-direction:column;gap:12px">';
      h += '<div class="row" style="align-items:flex-start"><div><p class="stop-addr">' + esc(c.street) + '</p><p class="muted" style="margin:2px 0 0;font-size:16px">' + esc(c.name) + " · " + esc(c.zone) + '</p></div><span class="chips" style="flex-direction:column;align-items:flex-end">' + itemsHtml(o.items) + "</span></div>";
      h += '<p class="muted" style="margin:0">' + WINDOWS[o.window] + (o.status === "on_the_way" ? " · בדרך" : "") + (o.fails ? " · ניסיון שני" : "") + (c.balance > 0 ? " · חוב " + shekel(c.balance) : "") + "</p>";
      if (cur) {
        const tk = truck(d);
        const short = K.filter((k) => (o.items[k] || 0) > Math.max(0, tk[k].left)).map((k) => "צריך " + cylWord(k, o.items[k]) + ", יש " + Math.max(0, tk[k].left));
        h += '<div class="two"><button class="soft-btn" data-nav="1">' + I("nav") + ' ניווט</button><button class="soft-btn" data-ring="' + c.id + '">' + I("phone") + " התקשר</button></div>";
        if (dmode.mode === "idle") {
          h += o.status !== "on_the_way" ? '<button class="btn k press" style="min-height:62px;font-size:22px" data-way="' + o.id + '"' + (short.length ? " disabled" : "") + '>יצאתי</button>' + (short.length ? '<p class="neg" style="margin:-4px 0 0;text-align:center;font-size:15px;font-weight:600">' + (d.loads.length ? "אין מספיק על המשאית: " + short.join(", ") + " — רשום העמסה" : "המשאית ריקה — קודם רושמים העמסה למעלה") + "</p>" : "") : '<button class="btn f press" style="min-height:62px;font-size:22px" data-mode="deliver">סופק</button>';
          h += '<button class="quiet-link" data-mode="fail">לא הצלחתי</button>';
        } else if (dmode.mode === "deliver") {
          h += '<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px">' +
            K.filter((k) => o.items[k]).map((k) => '<p style="margin:0;font-weight:700">' + TYPES[k].name + ' <span class="muted" style="font-weight:400;font-size:14px">· על המשאית ' + Math.max(0, tk[k].left) + '</span></p>' +
              '<div class="stepper"><span style="font-size:16px">מלאים שנמסרו</span><div class="ctl"><button data-dq="' + k + '" data-n="-1">−</button><b>' + dmode.q[k] + '</b><button data-dq="' + k + '" data-n="1"' + (dmode.q[k] >= Math.max(0, tk[k].left) ? " disabled" : "") + '>+</button></div></div>' +
              '<div class="stepper"><span style="font-size:16px">ריקים שנאספו</span><div class="ctl"><button data-de="' + k + '" data-n="-1">−</button><b>' + dmode.e[k] + '</b><button data-de="' + k + '" data-n="1">+</button></div></div>').join("") +
            '<div class="row"><span style="font-size:17px;font-weight:500">תשלום</span><b style="font-size:20px">' + shekel(itemsPrice(dmode.q)) + "</b></div>" +
            '<div class="seg" style="grid-template-columns:repeat(3,1fr)">' + Object.keys(PAY).map((k) => '<button class="' + (dmode.pay === k ? "on" : "") + '" data-pay="' + k + '">' + PAY[k] + "</button>").join("") + "</div>" +
            '<button class="btn f press" data-deliver="' + o.id + '"' + (itemsN(dmode.q) + itemsN(dmode.e) === 0 || K.some((k) => dmode.q[k] > Math.max(0, tk[k].left)) ? " disabled" : "") + '>אישור</button><button class="quiet-link" data-mode="idle">חזרה</button></div>';
        } else {
          h += '<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px">' +
            Object.keys(REASONS).map((k) => '<button class="soft-btn" data-fail="' + o.id + '" data-r="' + k + '">' + REASONS[k] + "</button>").join("") + '<button class="quiet-link" data-mode="idle">חזרה</button></div>';
        }
      }
      h += "</div>";
    });
    if (done.length) h += '<div class="card"><h2>סופקו היום · ' + done.length + '</h2><div class="list" style="margin-top:6px">' + done.map((o) => '<div class="li"><span>' + esc(cust(o.cid).name) + '</span><span class="s">' + itemsHtml(o.dq || o.items) + " · " + PAY[o.pay || "cash"] + "</span></div>").join("") + "</div></div>";
    $("driver").innerHTML = h;
  }

  // ---------- actions ----------
  function act(b) {
    const ds = b.dataset;
    if (ds.tab) { if (ds.tab === "office" && S.tab === "office") { ov = { v: "home" }; ovStack = []; } return setTab(ds.tab); }
    if (ds.open) return openOv(ds.open, ds.id);
    if (ds.back) { ov = ovStack.pop() || { v: "home" }; return render(); }
    if (ds.viewAs) { S.dme = ds.viewAs; dmode = { id: null }; if (window.innerWidth < 1100) return setTab("driver"); return render(); }
    if (ds.paid || ds.settle) {
      const c = cust(ds.paid || ds.settle); const kinds = ds.settle ? [ds.kind] : ["debt", "transfer"];
      const rows = S.orders.filter((o) => o.cid === c.id && o.status === "delivered" && kinds.includes(o.pay) && !o.settled);
      const amount = rows.reduce((a, o) => a + amountOf(o), 0);
      const what = kinds.length === 1 && kinds[0] === "transfer" ? "העברה אושרה" : "חוב נגבה";
      rows.forEach((o) => { o.settled = now(); (o.events = o.events || []).push({ at: o.settled, text: what + " במשרד · " + shekel(amountOf(o)) }); });
      c.balance = Math.max(0, c.balance - amount);
      S.payments.unshift({ at: now(), cid: c.id, amount, what });
      log("המשרד: " + what + " מ" + c.name + " · " + shekel(amount), null, c.id);
      render(); return toast(what + " · " + shekel(amount) + (c.balance ? " · נשאר " + shekel(c.balance) : " · הלקוח רואה ₪0"));
    }
    if (ds.bounce) {
      const c = cust(ds.bounce);
      const rows = S.orders.filter((o) => o.cid === c.id && o.status === "delivered" && o.pay === "transfer" && !o.settled);
      rows.forEach((o) => { o.pay = "debt"; (o.events = o.events || []).push({ at: now(), text: "ההעברה לא הגיעה → עבר לחוב" }); });
      log("המשרד: ההעברה של " + c.name + " לא הגיעה → עברה לחוב", null, c.id);
      render(); return toast("עבר ל«חוב שלא נגבה»");
    }
    if (ds.go) return setTab(ds.go);
    if (ds.me) { S.me = ds.me; ui.sheet = null; ui.confirmCancel = null; ui.notif = null; return render(); }
    if (ds.dme) { S.dme = ds.dme; dmode = { id: null }; return render(); }

    // customer
    if (ds.act === "order") { haptic(); const c = cust(S.me); ui.draft = { items: { ...c.last }, window: "any" }; ui.sheet = "order"; ui.anim = true; return render(); }
    if (ds.acct) { ui.sheet = "acct"; ui.anim = true; return render(); }
    if (ds.close) { ui.sheet = null; return render(); }
    if (ds.q) { ui.draft.items[ds.q] = Math.max(0, Math.min(6, ui.draft.items[ds.q] + Number(ds.n))); return render(); }
    if (ds.win) { ui.draft.window = ds.win; return render(); }
    if (ds.confirm) {
      haptic();
      const cid = S.me, st = ui.draft;
      ui.sheet = null; ui.skeleton = cid; render();
      setTimeout(() => {
        ui.skeleton = null;
        const d = placeOrder(cid, st);
        render();
        toast(d ? "ההזמנה הגיעה למשרד ושובצה ל" + d.name + " לבד" : "ההזמנה הגיעה למשרד · אין נהג לאזור", "office");
      }, 650);
      return;
    }
    if (ds.act === "call") {
      haptic();
      const c = cust(S.me);
      const x = { id: "k" + (++S.seq), cid: c.id, at: now(), handled: false };
      S.calls.push(x); flashIds.add("call-" + x.id);
      log(c.name + " לחץ «התקשר» באפליקציה", null, c.id);
      bump("office"); render();
      return toast("מחייג למשרד " + OFFICE_PHONE + " · המשרד כבר רואה שזה " + c.name, "office");
    }
    if (ds.ringDriver) return toast("כאן הטלפון מחייג ל" + drv(ds.ringDriver).name);
    if (ds.cancelAsk) { ui.confirmCancel = ds.cancelAsk; return render(); }
    if (ds.cancelNo) { ui.confirmCancel = null; return render(); }
    if (ds.cancelYes) {
      if (ui.undo) commitCancel();
      const o = S.orders.find((x) => x.id === ds.cancelYes);
      o.pendingCancel = true; ui.confirmCancel = null;
      ui.undo = { oid: o.id, cid: o.cid, left: 5 };
      ui.undo.timer = setInterval(() => {
        if (!ui.undo) return;
        ui.undo.left -= 1;
        if (ui.undo.left <= 0) { commitCancel(); render(); }
        else { const b = document.querySelector("[data-undo]"); if (b) b.textContent = "החזר (" + ui.undo.left + ")"; }
      }, 1000);
      return render();
    }
    if (ds.undo) { const o = S.orders.find((x) => x.id === ui.undo.oid); o.pendingCancel = false; clearInterval(ui.undo.timer); ui.undo = null; return render(); }
    if (ds.seen) { S.orders.find((x) => x.id === ds.seen).seen = true; return render(); }
    if (ds.sub) {
      const c = cust(S.me);
      if (ds.sub !== "0" && ds.sub !== "keep") { c.sub = Number(ds.sub); log(c.name + " עבר/ה להזמנה אוטומטית כל " + c.sub + " יום", null, c.id); flashIds.add("feed"); bump("office"); toast("נרשם · ההזמנה הבאה תצא לבד", "office"); }
      c.receipt = null; return render();
    }
    if (ds.unsub) { const c = cust(S.me); c.sub = null; log(c.name + " עצר/ה את ההזמנה האוטומטית", null, c.id); return render(); }

    // office
    if (ds.handled) { S.calls.find((x) => x.id === ds.handled).handled = true; return render(); }
    if (ds.like) { const x = S.calls.find((y) => y.id === ds.like); x.handled = true; officeOrderFor(x.cid, "אחרי שיחה"); render(); return toast("ההזמנה נפתחה · הלקוח רואה אותה באפליקציה", "customer"); }
    if (ds.officeOrder) { officeOrderFor(ds.officeOrder, "לפי הקצב"); render(); return toast("ההזמנה נפתחה ושובצה לבד", "driver"); }
    if (ds.assign) {
      const o = S.orders.find((x) => x.id === ds.assign); const d = drv(ds.d);
      o.status = "assigned"; o.driver = d.id; o.hold = null; o.rseq = ++S.seq;
      log("המשרד שיבץ את " + cust(o.cid).name + " ל" + d.name, o);
      notify(o.cid, d.name + " יביא לך את ההזמנה היום");
      flashIds.add("o-" + o.id); bump("driver"); render();
      return toast("שובץ ל" + d.name + " · מופיע אצלו עכשיו", "driver");
    }
    if (ds.cancel) { const o = S.orders.find((x) => x.id === ds.cancel); o.status = "cancelled"; log("המשרד ביטל הזמנה של " + cust(o.cid).name, o); notify(o.cid, "ההזמנה בוטלה על ידי המשרד"); return render(); }
    if (ds.ack) { S.orders.find((x) => x.id === ds.ack).ack = true; return render(); }

    // driver
    if (ds.mode) { dmode.mode = ds.mode; return render(); }
    if (ds.lq) { const f = lform[S.dme]; f[ds.lq] = Math.max(0, Math.min(40, f[ds.lq] + Number(ds.n))); return render(); }
    if (ds.unloadAsk) { unloadAsk = ds.unloadAsk; return render(); }
    if (ds.unloadNo) { unloadAsk = null; return render(); }
    if (ds.unload) {
      const d = drv(ds.unload); const tk = truck(d); const u = { at: now() };
      K.forEach((k) => { u[k] = tk[k].empties; });
      d.unloads.push(u); unloadAsk = null;
      log(d.name + " פרק במחסן: " + itemsTxt(u) + " ריקים");
      flashIds.add("feed"); bump("office"); render();
      return toast("נפרק · " + itemsN(u) + " ריקים נכנסו למחסן", "office");
    }
    if (ds.loadMore) { lform[ds.loadMore] = { "12": 0, "48": 0 }; return render(); }
    if (ds.loadCancel) { delete lform[ds.loadCancel]; return render(); }
    if (ds.load) {
      const d = drv(ds.load); const f = lform[d.id];
      d.loads.push({ at: now(), "12": f["12"], "48": f["48"] }); delete lform[d.id];
      log(d.name + " רשם העמסה: " + itemsTxt(f));
      flashIds.add("feed"); bump("office"); render();
      return toast("ההעמסה נשמרה · המשרד רואה מה יש על המשאית", "office");
    }
    if (ds.nav) return toast("כאן נפתח Waze עם הכתובת");
    if (ds.ring) return toast("כאן הטלפון מחייג ל" + cust(ds.ring).name);
    if (ds.way) {
      haptic();
      const o = S.orders.find((x) => x.id === ds.way); const d = drv(o.driver);
      o.status = "on_the_way"; o.eta = 18;
      log(d.name + " יצא ל" + cust(o.cid).name, o);
      notify(o.cid, d.name + " יצא אליך · בעוד 18 דק'");
      flashIds.add("o-" + o.id); bump("office"); render();
      return toast("הלקוח קיבל: «" + d.name + " יצא אליך · בעוד 18 דק'»", "customer");
    }
    if (ds.dq) { const left = Math.max(0, truck(drv(S.dme))[ds.dq].left); dmode.q[ds.dq] = Math.max(0, Math.min(left, dmode.q[ds.dq] + Number(ds.n))); return render(); }
    if (ds.de) { dmode.e[ds.de] = Math.max(0, Math.min(10, dmode.e[ds.de] + Number(ds.n))); return render(); }
    if (ds.pay) { dmode.pay = ds.pay; return render(); }
    if (ds.deliver) {
      haptic();
      const o = S.orders.find((x) => x.id === ds.deliver); const c = cust(o.cid); const d = drv(o.driver);
      const amount = itemsPrice(dmode.q);
      o.status = "delivered"; o.dq = { ...dmode.q }; o.de = { ...dmode.e }; o.pay = dmode.pay;
      K.forEach((k) => { c.held[k] = Math.max(0, c.held[k] - dmode.e[k]) + dmode.q[k]; });
      if (dmode.pay === "cash") d.cash += amount; else c.balance += amount;
      c.history.push({ d: new Date(), items: { ...dmode.q }, pay: dmode.pay });
      c.receipt = { items: { ...dmode.q }, empties: itemsN(dmode.e), pay: dmode.pay, amount, driver: d.name, at: now() };
      log(d.name + " סיפק ל" + c.name + ": " + itemsTxt(dmode.q) + " · אסף " + itemsN(dmode.e) + " ריקים · " + PAY[dmode.pay] + " " + shekel(amount), o);
      notify(c.id, "סופק · " + itemsN(dmode.q) + " " + (itemsN(dmode.q) === 1 ? "בלון" : "בלונים") + " · " + shekel(amount) + " " + PAY[dmode.pay]);
      flashIds.add("o-" + o.id); bump("office");
      dmode = { id: null }; render();
      return toast("נסגר · המלאי של הלקוח והקופה התעדכנו לבד", "customer");
    }
    if (ds.fail) {
      const o = S.orders.find((x) => x.id === ds.fail); const c = cust(o.cid); const d = drv(o.driver);
      o.fails += 1; o.reason = REASONS[ds.r];
      if (o.fails >= 2) {
        o.status = "tomorrow";
        log(c.name + ": נכשל פעמיים → עבר למחר, המשרד קיבל התראה", o);
        notify(c.id, "ההזמנה עברה למחר · המשרד יתקשר אליך");
        toast("עבר למחר · המשרד קיבל התראה", "office");
      } else {
        o.rseq = ++S.seq; o.status = "assigned";
        log(c.name + ": " + REASONS[ds.r] + " → עבר לסוף המסלול", o);
        notify(c.id, d.name + " לא מצא אותך · ינסה שוב בהמשך היום");
        toast("עבר לסוף המסלול · ננסה שוב בהמשך");
      }
      flashIds.add("o-" + o.id); bump("office");
      dmode = { id: null }; return render();
    }
  }

  function draw() {
    const y = window.scrollY;
    renderCustomer(); renderOffice(); renderDriver();
    flashIds = new Set(); ui.anim = false; ui.notifAnim = false;
    if (window.scrollY !== y) window.scrollTo(0, y);
  }
  // The customer screen morphs (shared hero element) when its state changes.
  function render() {
    const key = custKey();
    const changed = key !== lastKey;
    const first = lastKey === "";
    lastKey = key;
    const phoneVisible = window.innerWidth >= 1100 || S.tab === "customer";
    if (changed && !first && !reduced && phoneVisible && document.startViewTransition) {
      document.startViewTransition(draw);
    } else {
      draw();
    }
    if (!changed) document.querySelectorAll("#phone .state-in").forEach((n) => n.classList.remove("state-in"));
  }

  // ETA counts down while the driver is on the way.
  setInterval(() => {
    S.orders.forEach((o) => {
      if (o.status !== "on_the_way" || o.eta <= 3) return;
      o.eta -= 1;
      document.querySelectorAll('[data-eta="' + o.id + '"]').forEach((n) => { n.textContent = fmtEta(o.eta); });
    });
  }, 4000);

  document.addEventListener("click", (e) => { const b = e.target.closest("button, .scrim"); if (b) act(b); });
  $("reset").onclick = () => {
    if (ui.undo) clearInterval(ui.undo.timer);
    S = seed(); ui = { sheet: null, confirmCancel: null, skeleton: null, notif: null, notifTimer: null, undo: null }; dmode = { id: null }; lastKey = ""; ov = { v: "home" }; ovStack = []; lform = {}; unloadAsk = null;
    document.querySelectorAll(".badge").forEach((b) => { b.textContent = ""; b.classList.remove("show"); });
    setTab("customer");
  };
  $("h-customer").innerHTML = I("mobile") + " האפליקציה של הלקוח";
  $("h-office").innerHTML = I("screen") + " המשרד";
  $("h-driver").innerHTML = I("truck") + " האפליקציה של הנהג";
  render();
})();
</script>
