services:
  - type: web
    name: genealadin-api
    runtime: python
    plan: free
    branch: claude/stoic-edison-yi0ft9
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./genealadin.db
